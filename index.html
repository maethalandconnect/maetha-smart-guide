<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบผู้ช่วยอธิบายขั้นตอนการขอรับบริการ - สำนักงานที่ดินจังหวัดลำปาง สาขาแม่ทะ</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2942/2942813.png" type="image/png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #064e3b;
      font-family: sans-serif;
    }
    .iframe-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <!-- นำลิงก์ Web App (ที่ลงท้ายด้วย /exec) มาวางแทนที่ข้อความใน src="..." ด้านล่างนี้ -->
    <iframe 
      src="https://script.google.com/macros/s/AKfycbxk93YsilJ-iNkhepUOUiqda_3xyjgkurDzWPU-jQA6rN-m_-2QolBM5nRtfBWiOikm/exec"
      allow="autoplay; microphone; camera; fullscreen; clipboard-read; clipboard-write; speaker-selection"
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
